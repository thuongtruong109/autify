name: Build VM

on:
  push:
    branches:
      - main
    paths:
      - "vm/**"
  pull_request:
    branches:
      - main
    paths:
      - "vm/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-vm:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: ./vm
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        working-directory: ./vm
        run: |
          pyinstaller build.spec --clean

      - name: Copy templates folder to dist
        working-directory: ./vm
        run: |
          xcopy /E /I /Y templates dist\templates

      - name: Verify build
        working-directory: ./vm
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if ($exe) {
            Write-Host "✅ Build successful! Found EXE: $($exe.Name)"
            Write-Host "File size: $([math]::Round(($exe.Length / 1MB),2)) MB"
          } else {
            Write-Host "❌ Build failed! No .exe found in dist/"
            exit 1
          }

      - name: Create dist archive (auto name from exe)
        working-directory: ./vm
        shell: pwsh
        run: |
          # Detect exe
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          $base = $exe.BaseName  # example: autify_vm
          $archiveName = "$base.zip"

          # Create zip with auto name
          Compress-Archive -Path dist\* -DestinationPath $archiveName -Force

          echo "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV
          Write-Host "📦 Created archive: $archiveName"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autify-vm-build-${{ github.run_number }}
          path: vm/*.zip
          retention-days: 30
          compression-level: 0

      - name: Deploy artifact to GitHub Pages
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          # Checkout gh-pages
          git fetch origin gh-pages || echo "No gh-pages branch yet"
          git checkout -B gh-pages

          mkdir -p downloads
          cp vm/$ARCHIVE_NAME downloads/

          git add downloads
          git commit -m "Update artifact $ARCHIVE_NAME" || echo "No changes"
          git push origin gh-pages --force

      - name: Generate build summary
        shell: pwsh
        run: |
          $url = "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/downloads/$env:ARCHIVE_NAME"

          echo "## 🚀 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Executable:** $env:ARCHIVE_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Download:** [$env:ARCHIVE_NAME]($url)" >> $GITHUB_STEP_SUMMARY
